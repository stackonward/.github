  <line class="line" x1="500" y1="515" x2="1124" y2="515" stroke-width="1" />
  <text class="meta muted" x="500" y="540">WEBSITE</text>
  <text class="meta muted" x="688" y="540">ARTICLES</text>
  <text class="meta muted" x="864" y="540">RESOURCES</text>
