  <line class="line" x1="48" y1="600" x2="1152" y2="600" stroke-width="1" />
  <text class="meta faint" x="48" y="634">STACKONWARD.COM</text>
  <text class="meta muted" x="600" y="634" text-anchor="middle">PUBLIC WORK · VERIFIED CONTENT · REUSABLE ASSETS</text>
