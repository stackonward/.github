<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">远栈公开能力与内容体系</title>
  <desc id="desc">非对称栅格展示产品工程、商业系统、交付运维、开源工具和技术内容。</desc>
  <style>
    .canvas { fill: #F7F4ED; stroke: #E2DED5; }
    .surface { fill: #FCFCFA; stroke: #DDD9D0; }
    .surface-coral { fill: #FBEDE9; stroke: #EBC7BE; }
    .surface-blue { fill: #EDF2FA; stroke: #C9D6EA; }
    .ink { fill: #111214; }
    .text { fill: #303238; }
    .muted { fill: #72767D; }
    .faint { fill: #A3A5AA; }
    .line { stroke: #D8D4CB; }
    .route { stroke: #C7D4E8; }
    .coral { fill: #D9786F; }
    .blue { fill: #3657B3; }
    text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
    .kicker { font-size: 14px; font-weight: 700; letter-spacing: 2px; }
    .heading { font-size: 30px; font-weight: 700; }
    .card-title { font-size: 25px; font-weight: 700; }
    .card-body { font-size: 16px; font-weight: 450; }
    .meta { font-size: 13px; font-weight: 650; letter-spacing: 1.2px; }
    @media (prefers-color-scheme: dark) {
      .canvas { fill: #0B0C0E; stroke: #272A30; }
      .surface { fill: #111316; stroke: #2B2E34; }
      .surface-coral { fill: #201513; stroke: #53312B; }
      .surface-blue { fill: #111827; stroke: #263A60; }
      .ink { fill: #F2F2EF; }
      .text { fill: #D5D7DC; }
      .muted { fill: #999DA5; }
      .faint { fill: #666B73; }
      .line { stroke: #30333A; }
      .route { stroke: #2B3C5C; }
      .coral { fill: #EE8A80; }
      .blue { fill: #8AA2FF; }
    }
  </style>

  <rect class="canvas" x="1" y="1" width="1198" height="678" rx="28" />

