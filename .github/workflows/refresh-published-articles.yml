name: Refresh published articles

on:
  schedule:
    - cron: "29 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-published-articles
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout organization profile
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify article refresh
        run: python3 -m unittest discover -s tests -p 'test_*.py'

      - name: Refresh published articles
        run: python3 scripts/refresh_published_articles.py

      - name: Commit published article changes
        run: |
          git add profile/README.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh published articles"
          git push
